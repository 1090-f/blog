# 博客前台的反向代理站点（HTTP）。挂载到容器内的 /etc/nginx/conf.d/blog.conf。
#
# 现状：域名还没备案，所以只监听 80、按 IP 直接访问。
#   阿里云只拦「域名 + 80/443」，纯 IP 访问不触发备案校验，所以这条路现在就能用。
#
# 备案通过后怎么切到域名 + HTTPS（不改 compose、不重新发布）：
#   1. 用 acme.sh 签发证书，把 fullchain.pem / privkey.pem 装到 nginx/certs/
#   2. mv https.conf.example https.conf，把里面的 server_name 换成你的域名
#   3. 把本文件里的 :80 改成只做 301 跳转（注意保留 ACME 例外，见文件末尾注释）
#   4. docker exec <nginx容器名> nginx -s reload
#
# 容器名是 docker-nginx-1（compose 项目名取自目录名 docker）。用
#   docker compose --env-file docker/.env -f docker/compose.prod.yaml ps
# 可以确认。

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    # 没有域名可填，用 _ 匹配所有 Host —— 这样按 IP、按域名访问都能进来。
    server_name _;

    # acme.sh 做 HTTP-01 域名归属校验时，把临时文件写到这里，由 nginx 提供出去。
    # 用 ^~ 前缀（优先级高于普通前缀匹配），保证不会被 location / 抢走。
    # 关日志是因为这个路径会被全网扫描，留着只会刷满日志。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/acme;
        default_type text/plain;
        access_log   off;
    }

    # 体积上限、转发头、压缩规则都在这个片段里，站点块自己不放业务参数
    include /etc/nginx/snippets/blog-location.conf;

    # 这里刻意不写 access_log / error_log：
    # nginx 官方镜像把默认日志指向容器的 stdout / stderr，交给 Docker 的 json-file 驱动
    # 按 max-size 轮转。自己写文件反而需要额外挂一个日志卷并自己管轮转。
}

# 改成域名后，:80 站点应该只剩「跳转 + ACME 例外」两件事，大致长这样：
#
#     location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }   # 必须保留
#     location / { return 301 https://$host$request_uri; }
#
# ACME 例外不能省：证书续期走的就是 http://，全部跳 HTTPS 会让续期失败。
