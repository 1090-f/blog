# 反向代理 + 压缩的公共片段。
# 80（现在）和 443（备案后）两个站点块都 include 它 —— 同一套转发头只写一遍，
# 避免「改了一处忘了另一处」这种最难查的故障。

location / {
    # 用变量而不是直接把上游地址写进 proxy_pass：
    # app 容器每次部署都会被重建、容器 IP 会变，写死的地址会一直连着已经消失的旧 IP，
    # 表现就是发一次版页面全 502。配合下面的 resolver，nginx 会按 valid 周期重新解析。
    set $blog_upstream app:8080;
    proxy_pass http://$blog_upstream;

    # 127.0.0.11 是 Docker 内嵌 DNS，只在容器网络内可解析服务名。
    # ipv6=off 避免 AAAA 查询在只有 IPv4 的容器网络里空转。
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;

    # 这四行缺一个，后端看到的信息就是错的：
    #   Host              应用据此生成绝对 URL，写错会拼出错误的跳转地址
    #   X-Real-IP         应用记录的客户端 IP
    #   X-Forwarded-For   应用看到的整条链路
    #   X-Forwarded-Proto 应用判断请求是不是 HTTPS，漏了会导致 HTTPS 下仍生成 http:// 链接
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
}
