# 反向代理 + 压缩的公共片段。
# 80（现在）和 443（备案后）两个站点块都 include 它 —— 所有「跟业务请求有关」的参数
# 都集中在这里，站点块只负责监听地址、server_name 和证书。
# 这样两套配置不可能出现「80 能上传、443 传不了」这类只在切换后才暴露的差异。

location / {
    # 应用自己的上限是 5MiB（BLOG_UPLOAD_MAX_SIZE_BYTES）。
    # 这里必须留足余量：nginx 若设得比应用小，超限请求会被 nginx 直接 413 拦掉，
    # 应用没机会返回它自己格式的错误体，前端就拿到一个结构不对的响应。
    client_max_body_size 10m;

    # 用变量而不是直接把上游地址写进 proxy_pass：
    # app 容器每次部署都会被重建、容器 IP 会变，写死的地址会一直连着已经消失的旧 IP，
    # 表现就是发一次版页面全 502。配合下面的 resolver，nginx 会按 valid 周期重新解析。
    set $blog_upstream app:8080;
    proxy_pass http://$blog_upstream;

    # 127.0.0.11 是 Docker 内嵌 DNS，只在容器网络内可解析服务名。
    # ipv6=off 避免 AAAA 查询在只有 IPv4 的容器网络里空转。
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;

    # 这四行缺一个，后端看到的信息就是错的：
    #   Host              应用据此生成绝对 URL，写错会拼出错误的跳转地址
    #   X-Real-IP         应用记录的客户端 IP
    #   X-Forwarded-For   应用看到的整条链路
    #   X-Forwarded-Proto 应用判断请求是不是 HTTPS，漏了会导致 HTTPS 下仍生成 http:// 链接
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # 压缩交给 nginx：Go 应用不压缩，前端产物压完能小 60% 以上。
    # 放在这里而不是各站点块里，是为了只有一处定义（gzip_* 在 location 上下文同样合法）。
    gzip             on;
    gzip_min_length  1024;
    gzip_comp_level  5;
    gzip_vary        on;
    # 反代场景必须加 any，否则 nginx 认为响应不可缓存、直接跳过压缩。
    gzip_proxied     any;
    # 图片、字体、视频本身已是压缩格式，放进这里只会白烧 CPU。
    #
    # ⚠️ text/javascript 不能漏：这个应用的 /assets/*.js 返回的是
    #    Content-Type: text/javascript（Go 1.20 起 .js 的 MIME 从 application/javascript
    #    改成了 text/javascript），只写 application/javascript 的话 JS 一个都不会被压。
    #    排错手感：响应头里没有 Content-Encoding: gzip，且 Content-Length 等于原始大小。
    gzip_types       text/plain text/css text/xml text/javascript application/javascript
                     application/x-javascript application/json application/xml
                     application/rss+xml image/svg+xml;
}
