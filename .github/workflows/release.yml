name: Release

# 什么时候触发这条流水线。
# 日常 push 走 ci.yml 只跑测试；只有打了版本 tag 才进入发布流程。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "手动触发时是否在构建完成后执行部署"
        type: boolean
        default: false

# 镜像推到阿里云 ACR，凭据来自两个仓库 Secret（ACR_USERNAME / ACR_PASSWORD）。
# 不再需要 packages: write —— 那是「用 GITHUB_TOKEN 推 GHCR」才要的权限。
permissions:
  contents: read

env:
  # 为什么不用 GHCR：这台 ECS 在国内，直连 ghcr.io 实测只有 40~50 KB/s，
  # 17MB 的应用镜像要拉 6~8 分钟，还会把 SSH 部署步骤顶到超时。
  # ACR 同在国内，同一份镜像 1 秒内拉完。
  REGISTRY: crpi-lxhi919p6atrn34g.cn-hangzhou.personal.cr.aliyuncs.com
  # <命名空间>/<仓库名>。仓库类型必须是「公开」，否则服务器没登录就拉不动。
  IMAGE_NAME: fddz/blog

jobs:
  # ---------- 第 1~3 步：在 GitHub 的机器上构建并推送镜像 ----------
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算镜像名与 tag
        id: meta
        run: |
          # 镜像仓库要求仓库名全小写（ACR 与 GHCR 都是）
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          # 核心规则：tag 用 commit sha 前 12 位。
          # 同一个提交永远对应同一个镜像，可追溯、可回滚。
          # 刻意不推 latest —— latest 会被覆盖，回滚时没有「上一个」可切。
          SHA_TAG="${GITHUB_SHA::12}"
          {
            echo "image=${IMAGE}"
            echo "sha_tag=${SHA_TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${SHA_TAG}"
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # 登录名 = 阿里云账号名，在 ACR 控制台「访问凭证」页能看到
          username: ${{ secrets.ACR_USERNAME }}
          # 固定密码。临时密码只有 1 小时有效期，放进 CI 每次都要换，不现实。
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 关掉 buildx 默认附加的 provenance / SBOM 证明清单。
          # 它们不是镜像内容，而是 buildx 以 application/vnd.oci.empty.v1+json
          # 为 config 额外推的一个 platform=unknown/unknown 的 manifest；ACR 不认识
          # 这种 manifest，直接拒绝整个 push：
          #   denied: unknown manifest class for application/vnd.oci.empty.v1+json
          # （GHCR 接受它，所以索引里会多出一条 unknown/unknown —— 之前那份镜像就有。）
          provenance: false
          sbom: false
          # 复用 Actions 缓存的构建层，第二次起构建会快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 第 4 步：通过 SSH 让服务器执行部署脚本 ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 没配服务器时这个 job 自动跳过，构建部分照样能单独练通。
    # 注意：GitHub 不允许在 if 里读 secrets，所以要另建一个 repository variable
    # DEPLOY_ENABLED=true 当作开关。
    if: ${{ vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      - name: 通过 SSH 执行远程部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          # 默认只有 10 分钟。改用 ACR 后正常耗时不到 3 分钟
          # （拉镜像 1 秒 + 重建容器 + 健康检查最多 60 秒），15 分钟有 5 倍余量。
          # 不设更宽是因为超时失败极难排查：SSH 会话被杀后远端脚本静默中断，
          # 服务器上既没有 .deploy_state 也没有容器，看起来像「部署根本没执行」。
          # （v0.1.1 就是这么失败的 —— 当时上游是 ghcr.io，步骤耗时 10.1 分钟撞线。）
          command_timeout: 15m
          # 注意：这里不要写 script_stop: true。
          # appleboy/ssh-action v1 已经删掉了这个输入（写了会报
          # "Unexpected input(s) 'script_stop'"），改为由脚本自己负责 ——
          # 下面脚本第一行就是 set -e，效果等价且不依赖 action 的版本行为。
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            # 先把部署脚本本身更新到最新，再执行
            git fetch --tags --prune
            git checkout main
            git pull --ff-only
            # 用 bash 显式调用：Windows 上提交的文件常常没有可执行位
            bash scripts/deploy.sh "${{ needs.build-and-push.outputs.image_tag }}"
      - name: 部署后从公网复验
        if: ${{ vars.SITE_URL != '' }}
        run: curl -fsS --max-time 10 "${{ vars.SITE_URL }}/health"
